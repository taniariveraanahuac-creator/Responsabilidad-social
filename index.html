/* ---------- App ---------- */
function App(){
 const [db,setDb]=useState(null),[room,setRoom]=useState(null),[isAdmin,setAdmin]=useState(false);
 const [view,setView]=useState("start"),[team,setTeam]=useState(0),[tab,setTab]=useState("eq"),[sub,setSub]=useState({po:0,rs:0}),[demo,setDemo]=useState(false),[me,setMeS]=useState("");
 const [docs,setDocs]=useState({}),[teams,setTeams]=useState({}),[all,setAll]=useState({}),[peersRaw,setPeers]=useState([]),[clase,setClaseS]=useState(null),[now,setNow]=useState(Date.now());
 const [usr,setUsr]=useState(null),[ents,setEnts]=useState([]),[logs,setLogs]=useState([]),[snap,setSnap]=useState(null);
 const docsRef=useRef(docs);docsRef.current=docs;
 const logged=useRef({});
 const myId=async()=>{try{return usr&&usr.id?((await usr.id())||""):""}catch(e){return ""}};
 const logAcc=async(ev,t,nombre)=>{if(!db)return;const k=ev+"|"+t+"|"+nombre;if(logged.current[k])return;logged.current[k]=1;
  const uid=await myId();try{await db.collection("accesos").doc("a"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)).set({ev,team:t||0,n:nombre||"",uid,t:Date.now()});}catch(e){}};
 const pend=useRef(new Map()),timers=useRef({});
 useEffect(()=>{const t=setInterval(()=>setNow(Date.now()),1000);return()=>clearInterval(t);},[]);
 useEffect(()=>{let ok=true;const c=window.claude;if(!c||!c.use)return;
  c.use("db").then(d=>{if(ok&&d)setDb(d)}).catch(()=>{});
  c.use("room").then(r=>{if(ok&&r)setRoom(r)}).catch(()=>{});
  c.use("user").then(u=>{if(!ok||!u)return;setUsr(u);if(u.canEdit)u.canEdit().then(v=>{if(ok)setAdmin(!!v)}).catch(()=>{})}).catch(()=>{});
  return()=>{ok=false}},[]);
 useEffect(()=>{if(db&&usr)logAcc("abrir",0,"");},[db,usr]);
 useEffect(()=>{if(!db)return;let u;try{u=db.collection("entregas").onSnapshot(sn=>setEnts(sn.docs.map(d=>({...(d.data()||{}),id:d.id}))),()=>{});}catch(e){}return()=>{try{u&&u()}catch(e){}};},[db]);
 useEffect(()=>{if(!db||!isAdmin||view!=="panel")return;let u;try{u=db.collection("accesos").orderBy("t","desc").limit(500).onSnapshot(sn=>setLogs(sn.docs.map(d=>({...(d.data()||{}),id:d.id}))),()=>{});}catch(e){}return()=>{try{u&&u()}catch(e){}};},[db,isAdmin,view]);
 /* reloj compartido y lista de equipos */
 useEffect(()=>{if(!db)return;let u;try{u=db.doc("config/clase").onSnapshot(sn=>setClaseS(sn.exists?sn.data():null),()=>{});}catch(e){}return()=>{try{u&&u()}catch(e){}};},[db]);
 useEffect(()=>{if(!db)return;let u;try{u=db.collection("teams").onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{o[d.id]=d.data()||{}});setTeams(o);},()=>{});}catch(e){}return()=>{try{u&&u()}catch(e){}};},[db]);
 useEffect(()=>{if(!db||view!=="panel")return;const un=[];
  try{for(let n=1;n<=NT;n++)["p","r"].forEach(k=>un.push(db.collection("teams/"+n+"/"+(k==="p"?"porter":"rse")).onSnapshot(sn=>{const a=[];sn.docs.forEach(d=>{a[+d.id]=d.data()||{}});setAll(prev=>({...prev,[n]:{...(prev[n]||{p:[],r:[]}),[k]:a}}));},()=>{})));}catch(e){}
  return()=>un.forEach(f=>{try{f()}catch(e){}});},[db,view]);
 const paths=t=>{const o={m:"teams/"+t,g:"grades/"+t};for(let i=0;i<5;i++)o["p"+i]="teams/"+t+"/porter/"+i;for(let i=0;i<4;i++)o["r"+i]="teams/"+t+"/rse/"+i;return o;};
 const inTeam=view==="work"||view==="report"||view==="entrega";
 useEffect(()=>{if(!db||!team||demo||!inTeam)return;const PP=paths(team),un=[];
  const apply=(path,d)=>{let x=d||{};pend.current.forEach(v=>{if(v.path===path)x=setIn(x,v.p,v.v)});setDocs(prev=>({...prev,[path]:x}));};
  try{Object.values(PP).forEach(path=>un.push(db.doc(path).onSnapshot(sn=>apply(path,sn.exists?sn.data():{}),()=>{})));}catch(e){}
  return()=>un.forEach(f=>{try{f()}catch(e){}});},[db,team,demo,inTeam]);
 const PP=team?paths(team):{};
 const meta=docs[PP.m]||{},P=[0,1,2,3,4].map(i=>docs[PP["p"+i]]||{}),R=[0,1,2,3].map(i=>docs[PP["r"+i]]||{}),grade=docs[PP.g]||{};
 const myName=(members(meta).find(([k])=>k===me)||[,{}])[1].n||"";
 useEffect(()=>{if(!room)return;let off;try{off=room.onPeers(ch=>setPeers((ch&&ch.peers)||[]));}catch(e){}return()=>{try{typeof off==="function"&&off()}catch(e){}};},[room]);
 useEffect(()=>{if(!room)return;try{room.presence({team:view==="work"&&!demo?team:0,tab:view==="work"?tab:"",who:myName}).catch(()=>{})}catch(e){}},[room,team,tab,view,demo,myName]);
 const peers=peersRaw.filter(p=>p.presence&&p.presence.team===team&&!demo).map(p=>({tab:p.presence.tab,me:p.isMe,who:typeof p.presence.who==="string"?p.presence.who:""}));

 const write=(path,p,v)=>{
  const ea=(me&&!demo&&path.indexOf("teams/")===0&&p[0]!=="mem"&&p[0]!=="ed"&&p[0]!=="roles")?{m:me,n:myName,t:Date.now()}:null,ek=p.join("_");
  setDocs(prev=>{let x=setIn(prev[path]||{},p,v);if(ea)x=setIn(x,["ed",ek],ea);return {...prev,[path]:x};});
  if(!db||demo)return;
  const key=path+"|"+p.join(".");pend.current.set(key,{path,p,v});
  clearTimeout(timers.current[key]);
  timers.current[key]=setTimeout(()=>{const r=db.doc(path),done=()=>setTimeout(()=>{const c=pend.current.get(key);if(c&&c.v===v)pend.current.delete(key)},1500);
   const pl=ea?{...nest(p,v),ed:{[ek]:ea}}:nest(p,v);r.update(pl).then(done).catch(()=>{r.get().then(sn=>sn.exists?r.update(pl):r.set(setIn(docsRef.current[path]||{},p,v))).then(done).catch(()=>{});});},450);
 };
 const setMe=id=>{setMeS(id);lsSet("aud-me-"+team,id);};
 const go=async(t,who,newName)=>{
  setDemo(false);setTeam(t);setTab("eq");setSub({po:0,rs:0});
  let id=who;
  if(newName){id="m"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);const path="teams/"+t,val={n:newName,t:Date.now()};
   setDocs(prev=>({...prev,[path]:setIn(prev[path]||{},["mem",id],val)}));
   if(db){try{const r=db.doc(path),sn=await r.get();if(sn.exists)await r.update({mem:{[id]:val}});else await r.set({mem:{[id]:val}});}catch(e){}}}
  setMeS(id);lsSet("aud-me-"+t,id);lsSet("aud-last",JSON.stringify({t,id}));
  logAcc("equipo",t,newName||str(getIn(teams,[t,"mem",id,"n"])));
  setView("work");window.scrollTo(0,0);
 };
 const addMem=async(t,names)=>{const add={},now0=Date.now();names.forEach((n,i)=>{add["m"+now0.toString(36)+i+Math.random().toString(36).slice(2,5)]={n,t:now0+i};});
  if(db){const r=db.doc("teams/"+t),sn=await r.get();if(sn.exists)await r.update({mem:add});else await r.set({mem:add});}
  else setTeams(prev=>({...prev,[t]:{...(prev[t]||{}),mem:{...((prev[t]||{}).mem||{}),...add}}}));return add;};
 const openDemo=()=>{setDemo(true);setTeam(9);const Q=paths(9),o={[Q.m]:DMETA,[Q.g]:{}};DP.forEach((d,i)=>o[Q["p"+i]]=d);DR.forEach((d,i)=>o[Q["r"+i]]=d);setDocs(o);setMeS("a");setTab("po");setView("work");window.scrollTo(0,0);};
 const leave=()=>{setView("start");setDemo(false);setTeam(0);setDocs({});setMeS("");pend.current.clear();window.scrollTo(0,0);};
 const submit=async()=>{if(!db||demo||!team)throw new Error("x");const uid=await myId(),t=Date.now();
  await db.collection("entregas").doc("e"+team+"_"+t).set({team,grupo:grpOf(team).n,equipo:loc(team),emp:empOf(team).n,t,uid,n:myName||"",meta:clean(meta),P:P.map(clean),R:R.map(clean)});
  try{await db.collection("accesos").doc("a"+t.toString(36)+Math.random().toString(36).slice(2,6)).set({ev:"entrega",team,n:myName||"",uid,t});}catch(e){}};
 const setClase=v=>{setClaseS(v);if(db)db.doc("config/clase").set(v).catch(()=>{});};

 if(view==="start")return h(Start,{teams,go,addMem,demo:openDemo,live:!!db,isAdmin,openPanel:()=>setView("panel"),clase,now});
 if(view==="entrega"&&snap)return h(Report,{team:snap.team,meta:snap.meta||{},P:[0,1,2,3,4].map(i=>(snap.P||[])[i]||{}),R:[0,1,2,3].map(i=>(snap.R||[])[i]||{}),grade,isAdmin,demo:false,snapT:snap.t,snapBy:str(snap.n),wGrade:(p,v)=>write(PP.g,p,v),back:()=>{setView("panel");setSnap(null);window.scrollTo(0,0);},leave});
 if(view==="panel")return h(Panel,{teams,all,isAdmin,clase,setClase,now,ents,logs,usr,openEnt:e=>{setDemo(false);setSnap(e);setTeam(e.team);setView("entrega");window.scrollTo(0,0);},back:()=>setView("start"),openTeam:n=>{setDemo(false);setTeam(n);setView("report");window.scrollTo(0,0);}});
 if(view==="report")return h(Report,{team,meta,P,R,grade,isAdmin,demo,yo:myName,live:!!db,ent:team?lastOf(ents,team):null,submit,wGrade:(p,v)=>write(PP.g,p,v),back:()=>{setView(demo||me?"work":"panel");window.scrollTo(0,0);},leave});
 return h(Work,{team,meta,P,R,me,setMe,tab,setTab,sub,setSub,peers,live:!!db,demo,clase,now,leave,
  wm:(p,v)=>write(PP.m,p,v),wp:(i,p,v)=>write(PP["p"+i],p,v),wr:(i,p,v)=>write(PP["r"+i],p,v),report:()=>{setView("report");window.scrollTo(0,0);}});
}
ReactDOM.createRoot(document.getElementById("root")).render(h(App));
